<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LOTO7" />
  <meta name="theme-color" content="#0d1117" />
  <title>LOTO7 アナライザー</title>

  <!-- PWA マニフェスト（インライン） -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple Touch Icon（SVGベース） -->
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      background: #0d1117;
      min-height: 100%;
      min-height: -webkit-fill-available;
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      color: #e6edf3;
      overscroll-behavior: none;
    }

    .app {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Safe area for iPhone notch/home bar ── */
    .header {
      background: linear-gradient(90deg, #161b22, #1c2128);
      border-bottom: 1px solid #30363d;
      padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top));
    }
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 640px;
      display: flex;
      background: #161b22;
      border-top: 1px solid #30363d;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    /* ── Header ── */
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { font-size: 2rem; }
    .logo-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    .logo-sub { font-size: 0.7rem; color: #8b949e; margin-top: 2px; }
    .disclaimer-badge {
      font-size: 0.65rem;
      background: #2d1b00;
      color: #f0883e;
      border: 1px solid #f0883e40;
      border-radius: 6px;
      padding: 4px 8px;
    }

    /* ── Tab bar ── */
    .tab {
      flex: 1;
      padding: 0.75rem 0;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      cursor: pointer;
      border-top: 2px solid transparent;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .tab-icon { font-size: 1.2rem; }
    .tab-active { color: #a29bfe; border-top-color: #a29bfe; background: #a29bfe08; }

    /* ── Main scroll area ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      padding-bottom: calc(5rem + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .section { display: flex; flex-direction: column; gap: 1rem; }
    .section-title { font-size: 1rem; font-weight: 700; color: #e6edf3; }
    .section-sub { font-size: 0.78rem; color: #8b949e; margin-top: -0.5rem; }

    /* ── Algo cards ── */
    .algo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
    .algo-card {
      background: #161b22;
      border: 1.5px solid #30363d;
      border-radius: 10px;
      padding: 0.75rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      font-family: inherit;
      -webkit-user-select: none;
    }
    .algo-card:active { transform: scale(0.97); }
    .algo-label { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
    .algo-desc { font-size: 0.68rem; color: #8b949e; line-height: 1.4; }

    /* ── Generate button ── */
    .gen-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      -webkit-user-select: none;
    }
    .gen-btn:active { transform: scale(0.97); filter: brightness(0.9); }
    .gen-btn:disabled { opacity: 0.6; }

    /* ── Result card ── */
    .result-card {
      background: #161b22;
      border: 2px solid;
      border-radius: 14px;
      padding: 1.25rem;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 1rem;
    }
    .result-time { font-size: 0.72rem; }
    .result-note {
      font-size: 0.65rem;
      color: #6e7681;
      margin-top: 1rem;
      line-height: 1.5;
      border-top: 1px solid #30363d;
      padding-top: 0.75rem;
    }

    /* ── Balls ── */
    .balls-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
    .balls-sm { gap: 0.35rem; }
    .ball {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      background: #21262d;
      color: #8b949e;
      border: 1.5px solid #30363d;
      flex-shrink: 0;
    }
    .ball-sm  { width: 32px; height: 32px; font-size: 0.72rem; }
    .ball-md  { width: 40px; height: 40px; font-size: 0.9rem; }
    .ball-lg  { width: 50px; height: 50px; font-size: 1rem; }
    .ball-highlight {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      border-color: #a29bfe;
      box-shadow: 0 4px 12px rgba(162,155,254,0.35);
    }

    /* ── Frequency bars ── */
    .freq-list { display: flex; flex-direction: column; gap: 3px; }
    .freq-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .freq-row-selected { background: #a29bfe10; }
    .freq-num { font-size: 0.7rem; color: #8b949e; width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
    .freq-bar-wrap { flex: 1; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
    .freq-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .freq-count { font-size: 0.65rem; color: #6e7681; width: 28px; text-align: right; }

    /* ── Stats ── */
    .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .stat-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
    .stat-val { font-size: 1.75rem; font-weight: 800; color: #a29bfe; }
    .stat-lbl { font-size: 0.65rem; color: #8b949e; margin-top: 4px; }

    /* ── History ── */
    .history-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .history-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 0.85rem;
    }
    .history-card.past { border-color: #21262d; }
    .history-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 0.6rem;
    }
    .past-label { color: #58a6ff; font-weight: 600; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 3rem 1rem; color: #6e7681; }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.85rem; line-height: 1.7; }

    /* ── Install banner ── */
    .install-banner {
      margin: 0 0 1rem;
      background: #1c2128;
      border: 1px solid #388bfd40;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .install-banner-text { flex: 1; font-size: 0.75rem; color: #8b949e; line-height: 1.5; }
    .install-banner-text strong { color: #58a6ff; display: block; margin-bottom: 2px; }
    .install-close {
      background: none;
      border: none;
      color: #6e7681;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎱</span>
        <div>
          <h1 class="logo-title">LOTO7 アナライザー</h1>
          <p class="logo-sub">過去データ分析による番号提案ツール</p>
        </div>
      </div>
      <div class="disclaimer-badge">⚠️ 当選保証なし・娯楽目的</div>
    </div>
  </header>

  <main class="main" id="main"></main>

  <nav class="tab-bar" id="tabBar"></nav>
</div>

<script>
// ══════════════════════════════════════════════════════
// データ & ロジック
// ══════════════════════════════════════════════════════
const PAST_RESULTS = [
  [2,7,14,21,28,31,37],[1,5,12,19,25,30,35],[3,9,16,22,27,33,37],
  [4,8,13,20,26,32,36],[6,11,18,24,29,34,37],[2,10,15,21,27,31,35],
  [1,7,14,20,26,30,36],[5,9,17,23,28,33,37],[3,11,16,22,25,32,35],
  [4,8,13,19,27,31,34],[6,10,18,24,26,30,37],[2,7,15,21,29,33,36],
  [1,9,14,20,28,32,35],[5,11,17,23,27,31,37],[3,8,16,22,26,30,34],
  [4,10,13,19,25,33,36],[6,7,18,24,28,32,35],[2,9,15,21,27,31,37],
  [1,11,14,20,26,30,36],[5,8,17,23,29,33,34],[3,10,16,22,25,32,37],
  [4,7,13,19,28,31,35],[6,9,18,24,27,30,36],[2,11,15,21,26,33,37],
  [1,8,14,20,29,32,34],[5,10,17,23,25,31,35],[3,7,16,22,28,30,37],
  [4,9,13,19,27,33,36],[6,11,18,24,26,32,35],[2,8,15,21,29,31,34],
];

function analyzeFrequency(results) {
  const f = {}; for (let i=1;i<=37;i++) f[i]=0;
  results.forEach(r => r.forEach(n => f[n]++)); return f;
}
function analyzeRecency(results, w=10) {
  const f = {}; for (let i=1;i<=37;i++) f[i]=0;
  results.slice(-w).forEach(r => r.forEach(n => f[n]++)); return f;
}
function getLastAppearance(results) {
  const l = {}; for (let i=1;i<=37;i++) l[i]=-1;
  results.forEach((r,idx) => r.forEach(n => l[n]=idx)); return l;
}
function pickTopN(scores, n) {
  return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>+k);
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const ALGORITHMS = {
  hot:     { label:"🔥 ホット戦略",   desc:"直近10回で最も頻出の数字を優先",            color:"#ff6b35",
    generate: r => { const f=analyzeRecency(r,10); return shuffle(pickTopN(f,14)).slice(0,7).sort((a,b)=>a-b); } },
  cold:    { label:"❄️ コールド戦略", desc:"しばらく出ていない「そろそろ出る」数字を選択", color:"#4ecdc4",
    generate: r => { const l=getLastAppearance(r),s={}; for(let i=1;i<=37;i++) s[i]=l[i]===-1?9999:r.length-1-l[i]; return shuffle(pickTopN(s,14)).slice(0,7).sort((a,b)=>a-b); } },
  balance: { label:"⚖️ バランス戦略", desc:"全体頻度・直近頻度・間隔を組み合わせた総合スコア", color:"#a29bfe",
    generate: r => { const o=analyzeFrequency(r),rc=analyzeRecency(r,10),l=getLastAppearance(r),s={},mx=r.length;
      for(let i=1;i<=37;i++){const d=l[i]===-1?mx:r.length-1-l[i]; s[i]=o[i]*0.3+rc[i]*0.5+(d/mx)*mx*0.2;}
      return shuffle(pickTopN(s,14)).slice(0,7).sort((a,b)=>a-b); } },
  pattern: { label:"🔢 パターン戦略", desc:"奇数・偶数・数字帯のバランスを重視して選択", color:"#fd79a8",
    generate: r => { const f=analyzeFrequency(r),bands=[[1,9],[10,18],[19,27],[28,37]],picks=[];
      bands.forEach(([lo,hi])=>{ const b={}; for(let i=lo;i<=hi;i++) b[i]=f[i]; picks.push(shuffle(pickTopN(b,3))[0]); });
      const rem=[];for(let i=1;i<=37;i++) if(!picks.includes(i)) rem.push(i);
      shuffle(rem).slice(0,3).forEach(n=>picks.push(n)); return picks.sort((a,b)=>a-b); } },
  quantum: { label:"⚛️ ランダム戦略", desc:"完全ランダム（どの戦略も結局はこれと同じ確率）", color:"#55efc4",
    generate: () => shuffle(Array.from({length:37},(_,i)=>i+1)).slice(0,7).sort((a,b)=>a-b) },
};

// ══════════════════════════════════════════════════════
// 状態
// ══════════════════════════════════════════════════════
let state = {
  tab: "predict",
  selectedAlgo: "balance",
  prediction: null,
  generating: false,
  history: [],
  showInstallBanner: !window.matchMedia("(display-mode: standalone)").matches,
  freq: analyzeFrequency(PAST_RESULTS),
};

// ══════════════════════════════════════════════════════
// レンダリング
// ══════════════════════════════════════════════════════
function ball(n, highlight, size="md") {
  return `<div class="ball ball-${size}${highlight?" ball-highlight":""}">${n}</div>`;
}

function renderPredict() {
  const algo = ALGORITHMS[state.selectedAlgo];
  const installBanner = state.showInstallBanner ? `
    <div class="install-banner">
      <span style="font-size:1.5rem">📲</span>
      <div class="install-banner-text">
        <strong>iPhoneにインストールできます</strong>
        Safariの共有ボタン →「ホーム画面に追加」でアプリとして使えます
      </div>
      <button class="install-close" onclick="dismissBanner()">✕</button>
    </div>` : "";

  const algoCards = Object.entries(ALGORITHMS).map(([k,a]) => {
    const active = k===state.selectedAlgo;
    const style = active
      ? `border-color:${a.color};box-shadow:0 0 0 2px ${a.color}40;background:${a.color}18`
      : "";
    const labelColor = active ? a.color : "#dfe6e9";
    return `<button class="algo-card" style="${style}" onclick="selectAlgo('${k}')">
      <div class="algo-label" style="color:${labelColor}">${a.label}</div>
      <div class="algo-desc">${a.desc}</div>
    </button>`;
  }).join("");

  const resultCard = state.prediction && !state.generating ? `
    <div class="result-card" style="border-color:${ALGORITHMS[state.prediction.algo].color}">
      <div class="result-header">
        <span>${ALGORITHMS[state.prediction.algo].label}</span>
        <span class="result-time">${state.prediction.time}</span>
      </div>
      <div class="balls-row">
        ${state.prediction.numbers.map(n=>ball(n,true,"lg")).join("")}
      </div>
      <p class="result-note">※ この番号はアルゴリズムによる提案です。ロト7は完全ランダム抽選のため、当選を保証するものではありません。</p>
    </div>` : "";

  const btnText = state.generating ? "⚙️ 分析中..." : "🎲 番号を予測する";
  return `
    ${installBanner}
    <h2 class="section-title">戦略を選んでください</h2>
    <div class="algo-grid">${algoCards}</div>
    <button class="gen-btn" style="background:${algo.color}" onclick="generate()" ${state.generating?"disabled":""}>
      ${btnText}
    </button>
    ${resultCard}`;
}

function renderStats() {
  const maxFreq = Math.max(...Object.values(state.freq));
  const sorted = Array.from({length:37},(_,i)=>i+1).sort((a,b)=>state.freq[b]-state.freq[a]);
  const bars = sorted.map(n => {
    const pct = Math.round((state.freq[n]/maxFreq)*100);
    const sel = state.prediction?.numbers.includes(n);
    const bg = sel
      ? "linear-gradient(90deg,#a29bfe,#6c5ce7)"
      : "linear-gradient(90deg,#636e72,#b2bec3)";
    return `<div class="freq-row${sel?" freq-row-selected":""}">
      <span class="freq-num">${String(n).padStart(2,"0")}</span>
      <div class="freq-bar-wrap"><div class="freq-bar-fill" style="width:${pct}%;background:${bg}"></div></div>
      <span class="freq-count">${state.freq[n]}回</span>
    </div>`;
  }).join("");

  const total = Object.values(state.freq).reduce((a,b)=>a+b,0);
  const avg = Math.round(total/37);
  const zero = Object.values(state.freq).filter(v=>v===0).length;

  return `
    <h2 class="section-title">過去30回の出現頻度</h2>
    <p class="section-sub">直近30回の当選番号に基づく集計（サンプルデータ）</p>
    <div class="freq-list">${bars}</div>
    <div class="stats-summary">
      <div class="stat-box"><div class="stat-val">${maxFreq}</div><div class="stat-lbl">最高出現数</div></div>
      <div class="stat-box"><div class="stat-val">${avg}</div><div class="stat-lbl">平均出現数</div></div>
      <div class="stat-box"><div class="stat-val">${zero}</div><div class="stat-lbl">未出現数</div></div>
    </div>`;
}

function renderHistory() {
  const myHistory = state.history.length === 0
    ? `<div class="empty-state"><div class="empty-icon">🎱</div><p>まだ予測がありません。<br>「予測」タブで番号を生成してください。</p></div>`
    : state.history.map(h => `
        <div class="history-card">
          <div class="history-header">
            <span style="color:${ALGORITHMS[h.algo].color}">${ALGORITHMS[h.algo].label}</span>
            <span class="result-time">${h.time}</span>
          </div>
          <div class="balls-row balls-sm">${h.numbers.map(n=>ball(n,true,"sm")).join("")}</div>
        </div>`).join("");

  const pastRows = PAST_RESULTS.slice(-10).reverse().map((r,i) => `
    <div class="history-card past">
      <div class="history-header"><span class="past-label">第 ${PAST_RESULTS.length-i} 回</span></div>
      <div class="balls-row balls-sm">${r.map(n=>ball(n,false,"sm")).join("")}</div>
    </div>`).join("");

  return `
    <h2 class="section-title">予測履歴</h2>
    <div class="history-list">${myHistory}</div>
    <h2 class="section-title" style="margin-top:1.5rem">サンプル当選番号（直近10回）</h2>
    <div class="history-list">${pastRows}</div>`;
}

function renderTabs() {
  const tabs = [
    { id:"predict", icon:"🎯", label:"予測" },
    { id:"stats",   icon:"📊", label:"統計" },
    { id:"history", icon:"📋", label:"履歴" },
  ];
  return tabs.map(t => `
    <button class="tab${state.tab===t.id?" tab-active":""}" onclick="switchTab('${t.id}')">
      <span class="tab-icon">${t.icon}</span>${t.label}
    </button>`).join("");
}

function render() {
  const content = state.tab==="predict" ? renderPredict()
                : state.tab==="stats"   ? renderStats()
                : renderHistory();
  document.getElementById("main").innerHTML = `<div class="section">${content}</div>`;
  document.getElementById("tabBar").innerHTML = renderTabs();
}

// ══════════════════════════════════════════════════════
// アクション
// ══════════════════════════════════════════════════════
function switchTab(id) { state.tab=id; render(); }
function selectAlgo(k) { state.selectedAlgo=k; render(); }
function dismissBanner() { state.showInstallBanner=false; render(); }

function generate() {
  if (state.generating) return;
  state.generating = true;
  render();
  setTimeout(() => {
    const numbers = ALGORITHMS[state.selectedAlgo].generate(PAST_RESULTS);
    const entry = { numbers, algo: state.selectedAlgo, time: new Date().toLocaleTimeString("ja-JP") };
    state.prediction = entry;
    state.history = [entry, ...state.history].slice(0, 10);
    state.generating = false;
    render();
  }, 800);
}

// ══════════════════════════════════════════════════════
// Service Worker 登録（PWA オフライン対応）
// ══════════════════════════════════════════════════════
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// 初回レンダリング
render();
</script>
</body>
</html>
